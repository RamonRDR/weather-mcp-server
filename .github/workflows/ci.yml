name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Unit and MCP integration tests
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Verify README test badges against pytest results
        run: python scripts/check_readme_badges.py pytest-results.xml
      - name: Package build
        run: python -m build
      - name: Validate package contents
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
