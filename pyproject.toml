[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-mcp-server"
version = "0.1.0"
description = "Secure, read-only MCP weather tools with Weather Cache API integration."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "Ramon Rodriguez"}]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "build>=1.3,<2",
]

[project.scripts]
weather-mcp-server = "weather_mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
